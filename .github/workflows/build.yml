name: Build SARBAZ Racing APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get game source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --user --upgrade pip
          python -m pip install --user buildozer cython==0.29.36

      - name: Create Android configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = SARBAZ Racing
          package.name = sarbazracing
          package.domain = org.sarbaz
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,mp3,wav
          version = 1.0.0
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 0
          android.api = 35
          android.minapi = 23
          android.archs = arm64-v8a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARBAZ-Racing-APK
          path: bin/*.apk
          if-no-files-found: error
